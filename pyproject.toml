[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kgi-interop-monitor"
dynamic = ["version"]
description = "nicescholia-based dashboard for the SPARQL endpoints in the KGI4NFDI registry"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"   # ngwidgets/nicescholia require 3.11

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: User Interfaces",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
  "nicescholia @ git+https://github.com/WolfgangFahl/nicescholia.git@main",
]

[project.optional-dependencies]
dev = [
  # scripts/blackisort
  "black>=24",
  "isort>=5",
]

[project.urls]
Home = "https://github.com/KGI4NFDI/kgi-interop-monitor"

[project.scripts]
kgi-interop-monitor = "kgi_interop_monitor.cmd:main"

[tool.hatch.version]
path = "src/kgi_interop_monitor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kgi_interop_monitor"]

# src layout: strip the src/ prefix so the wheel installs kgi_interop_monitor/
[tool.hatch.build.targets.wheel.sources]
"src/kgi_interop_monitor" = "kgi_interop_monitor"

[tool.hatch.metadata]
allow-direct-references = true   # for the git dependency above

# match black's line length
[tool.isort]
profile = "black"
