name: Tests

on:
  push:
    branches-ignore: [results]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Offline tests only: every endpoint is a local fake. Tests marked
      # `live` talk to the internet and are deselected by pyproject.toml.
      - run: pytest -q
